apiVersion: apps/v1
kind: Deployment
metadata:
  name: banbot
  labels:
    app.kubernetes.io/name: banbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: banbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banbot
    spec:
      containers:
        - name: banbot
          image: ghcr.io/bdomars/banbot:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: banbot-config
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
      securityContext:
        seccompProfile:
          type: RuntimeDefault
