apiVersion: v1
kind: Secret
metadata:
  name: banbot-config
type: Opaque
stringData:
  DISCORD_TOKEN: replace-me
  DISCORD_LOG_CHANNEL_NAME: bot-actions
  DISCORD_DRY_RUN: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banbot
  labels:
    app.kubernetes.io/name: banbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: banbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banbot
    spec:
      containers:
        - name: banbot
          image: ghcr.io/bdomars/banbot:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: banbot-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
      securityContext:
        seccompProfile:
          type: RuntimeDefault
